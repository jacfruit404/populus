<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Populus — Population Simulation MVP</title>
<style>
:root{
  --bg:#15110e; --bg2:#100d0b; --panel:#1c1714; --panel2:#231d19;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
  --ink:#f4eee6; --ink2:#cdc2b5; --muted:#93877a; --faint:#6b6055;
  --gold:#d9a441; --gold2:#f0c675; --teal:#4fb3a5; --red:#cd6a4c; --blue:#6d8fc4;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:22px;height:22px;border-radius:50%;background:
  radial-gradient(circle at 32% 30%, var(--gold2), var(--gold) 42%, #8a5f1c 78%, #3a2a12);
  box-shadow:0 0 16px rgba(217,164,65,.35)}
.logo b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.02em}
.tagline{margin-top:7px;font-size:10.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase}
.steps{padding:16px 12px;flex:0 0 auto}
.steplbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:0 8px 8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:7px;color:var(--muted);transition:.15s;width:100%;text-align:left}
.step:hover{background:rgba(255,255,255,.035);color:var(--ink2)}
.step.on{background:rgba(217,164,65,.10);color:var(--ink)}
.step.done{color:var(--ink2)}
.step .n{font-family:var(--mono);font-size:10px;width:17px;height:17px;flex:0 0 17px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-top:1px;color:var(--faint)}
.step.on .n{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.13)}
.step.done .n{border-color:rgba(79,179,165,.5);color:var(--teal)}
.step .t{font-size:12.5px;font-weight:500}
.step .s{font-size:10.5px;color:var(--faint);margin-top:1px}
.railfoot{margin-top:auto;padding:14px;border-top:1px solid var(--line2)}
.runs{padding:0 12px 12px;overflow-y:auto;flex:1 1 auto;min-height:0}
.runitem{padding:8px 9px;border-radius:6px;border:1px solid var(--line2);margin-bottom:6px;cursor:pointer;transition:.15s}
.runitem:hover{border-color:var(--line);background:rgba(255,255,255,.03)}
.runitem .q{font-size:11.5px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.runitem .m{font-size:10px;color:var(--faint);font-family:var(--mono);margin-top:4px}

.main{overflow-y:auto;position:relative}
.wrap{max-width:1080px;margin:0 auto;padding:40px 44px 96px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.eyebrow:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,rgba(217,164,65,.35),transparent)}
h1{font-family:var(--serif);font-size:34px;line-height:1.15;font-weight:500;margin:14px 0 8px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--gold2)}
.sub{color:var(--muted);font-size:14px;max-width:600px;margin-bottom:30px}
h3{font-family:var(--serif);font-size:19px;font-weight:500;margin:0 0 3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.card+.card{margin-top:16px}
.lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;font-family:var(--mono)}

/* ---------- controls ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:13px;text-align:left;transition:.15s}
.tile:hover{border-color:rgba(217,164,65,.4)}
.tile.on{border-color:var(--gold);background:rgba(217,164,65,.09)}
.tile .ti{font-size:13px;font-weight:600;margin-bottom:3px}
.tile .td{font-size:11px;color:var(--muted);line-height:1.4}
textarea.q{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:13px 14px;
  font-family:var(--serif);font-size:17px;line-height:1.45;resize:vertical;min-height:66px;outline:none}
textarea.q:focus{border-color:rgba(217,164,65,.55)}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.optrow input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:9px 12px;outline:none;font-size:13px}
.optrow input:focus{border-color:rgba(217,164,65,.5)}
.optrow .idx{font-family:var(--mono);font-size:10px;color:var(--faint);width:16px}
.x{width:26px;height:26px;border-radius:6px;color:var(--faint);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.x:hover{background:rgba(205,106,76,.14);color:var(--red)}
.ghost{border:1px dashed var(--line);border-radius:7px;padding:8px 12px;color:var(--muted);font-size:12px;width:100%}
.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn{background:var(--gold);color:#231705;font-weight:650;padding:11px 22px;border-radius:8px;font-size:13.5px;letter-spacing:.01em;transition:.15s}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink2);font-weight:500}
.btn.sec:hover{border-color:var(--gold);color:var(--gold2);background:transparent}
.actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.hint{font-size:11.5px;color:var(--faint)}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--line);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 0 4px rgba(217,164,65,.16)}

/* ---------- segments ---------- */
.seg{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line2);border-radius:9px;margin-bottom:7px;transition:.15s;cursor:pointer}
.seg:hover{border-color:var(--line)}
.seg.off{opacity:.36}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:5px}
.seg .nm{font-size:13px;font-weight:600}
.seg .bl{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.seg .sh{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right;flex:0 0 auto}
.seg .sh small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.08em}

/* ---------- population grid ---------- */
.popgrid{display:flex;flex-wrap:wrap;gap:3px;padding:4px 0}
.ag{width:9px;height:9px;border-radius:2px;opacity:.85;cursor:pointer;transition:.12s}
.ag:hover{transform:scale(1.7);opacity:1;z-index:2}
.ag.no{opacity:.16}

/* ---------- run screen ---------- */
.runbox{text-align:center;padding:60px 0 20px}
.orb{width:160px;height:160px;margin:0 auto 30px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 40% 34%, rgba(240,198,117,.9), rgba(217,164,65,.5) 38%, rgba(120,80,25,.25) 62%, transparent 72%);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.orb:after{content:'';position:absolute;inset:-24px;border-radius:50%;border:1px solid rgba(217,164,65,.18);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.phase{font-family:var(--serif);font-size:22px;margin-bottom:8px}
.phasesub{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em;height:16px}
.bar{height:2px;background:var(--line);border-radius:2px;margin:26px auto 0;max-width:400px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .3s}
.log{max-width:460px;margin:26px auto 0;text-align:left;font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.9}
.log div{opacity:0;animation:fadein .4s forwards}
@keyframes fadein{to{opacity:1}}
.log b{color:var(--teal);font-weight:400}

/* ---------- results ---------- */
.headline{background:linear-gradient(160deg,rgba(217,164,65,.13),rgba(217,164,65,.02) 55%,transparent);
  border:1px solid rgba(217,164,65,.28);border-radius:14px;padding:26px 26px 24px}
.verdict{font-family:var(--serif);font-size:29px;line-height:1.2;margin:8px 0 12px}
.verdict b{color:var(--gold2);font-weight:500}
.metrics{display:flex;gap:32px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid rgba(217,164,65,.18)}
.metric .v{font-family:var(--serif);font-size:27px;line-height:1}
.metric .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-family:var(--mono)}
.metric .ci{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}

.orow{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.orow:last-child{border-bottom:none}
.oname{font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.win{font-family:var(--mono);font-size:9px;letter-spacing:.1em;background:rgba(217,164,65,.18);color:var(--gold2);padding:2px 6px;border-radius:4px}
.track{height:9px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,rgba(217,164,65,.55),var(--gold));transition:width .7s cubic-bezier(.2,.8,.3,1)}
.track.dim i{background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.28))}
.track .cib{position:absolute;top:2px;height:5px;border-left:1px solid rgba(255,255,255,.35);border-right:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.09)}
.oval{font-family:var(--serif);font-size:20px;text-align:right}
.oval small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}

table.mx{width:100%;border-collapse:collapse;font-size:12.5px}
table.mx th{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:400;padding:0 6px 10px;text-align:center}
table.mx th:first-child{text-align:left;width:31%}
table.mx td{padding:5px 6px}
table.mx td:first-child{font-size:12.5px}
.cell{border-radius:6px;padding:9px 4px;text-align:center;font-family:var(--mono);font-size:12px;position:relative}
.segname{display:flex;align-items:center;gap:8px}
.segname small{color:var(--faint);font-family:var(--mono);font-size:10px}

.driver{display:grid;grid-template-columns:150px 1fr 62px;gap:12px;align-items:center;padding:7px 0}
.dtrack{height:6px;background:rgba(255,255,255,.05);border-radius:3px;position:relative}
.dtrack .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.dtrack i{position:absolute;height:100%;border-radius:3px}
.dv{font-family:var(--mono);font-size:11.5px;text-align:right}

.quote{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin-bottom:16px}
.quote p{font-family:var(--serif);font-size:14.5px;line-height:1.5;margin:0 0 7px;color:var(--ink)}
.quote .who{font-size:11px;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:9.5px;padding:1.5px 6px;border-radius:4px;letter-spacing:.05em}
.pill.y{background:rgba(79,179,165,.14);color:var(--teal)}
.pill.n{background:rgba(205,106,76,.14);color:var(--red)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:18px}
.tab{padding:8px 14px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab:hover{color:var(--ink2)}

.ledger{font-family:var(--mono);font-size:11.5px}
.ledger .lr{display:grid;grid-template-columns:1fr 74px 74px 66px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);color:var(--ink2)}
.ledger .lr.h{color:var(--faint);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase}
.ledger .lr span:not(:first-child){text-align:right}

/* ---------- agent modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,6,5,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:26px;max-height:84vh;overflow-y:auto}
.mhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:17px;color:#1a1310;font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 14px;font-size:12.5px;padding:14px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin-bottom:16px}
.kv .k{color:var(--faint);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}
.resp{padding:11px 13px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);margin-bottom:8px}
.resp .rt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px}
.resp .rq{font-family:var(--serif);font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
.note{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:40px 0}
/* ---------- local model panel ---------- */
.llm{border:1px solid rgba(79,179,165,.3);background:linear-gradient(160deg,rgba(79,179,165,.07),transparent 60%)}
.conn{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.led{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.led.ok{background:var(--teal);box-shadow:0 0 8px rgba(79,179,165,.7)}
.led.bad{background:var(--red)}
.led.wait{background:var(--gold);animation:pulse 1.2s infinite}
.fld{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.fld label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);width:74px;flex:0 0 74px}
.fld input,.fld select{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12.5px;outline:none}
.fld input:focus,.fld select:focus{border-color:rgba(79,179,165,.55)}
.fld select option{background:var(--panel)}
.modes{display:flex;gap:6px;margin-bottom:12px}
.mode{padding:6px 12px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.mode.on{border-color:var(--teal);color:var(--teal);background:rgba(79,179,165,.1)}
.llmlog{font-family:var(--mono);font-size:10.5px;line-height:1.75;color:var(--faint);margin-top:12px;
  max-height:150px;overflow-y:auto;border-top:1px solid var(--line2);padding-top:10px}
.llmlog b{color:var(--teal);font-weight:400}
.llmlog i{color:var(--red);font-style:normal}
.llmlog u{color:var(--gold2);text-decoration:none}
.mismatch{border:1px solid rgba(205,106,76,.45);background:rgba(205,106,76,.09);border-radius:11px;
  padding:15px 17px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.mismatch .ic{color:var(--red);font-size:15px;line-height:1.2;flex:0 0 auto}
.mismatch .tx{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.mismatch b{color:var(--red);display:block;margin-bottom:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);font-weight:400}
.fadein{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{display:none}.wrap{padding:28px 20px 80px}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo"><div class="mark"></div><b>Populus</b></div>
      <div class="tagline">Population Simulation</div>
    </div>
    <nav class="steps" id="steps"></nav>
    <div class="steplbl" style="padding-left:20px">Run history</div>
    <div class="runs" id="runs"><div class="hint" style="padding:0 8px">No runs yet.</div></div>
    <div class="railfoot">
      <div class="hint" style="line-height:1.5">Every prediction is logged against what reality returns.</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<script src="engine.js"></script>
<script>
/* ============================== UTIL ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Every piece of simulation logic lives in engine.js — pure, no DOM, and
   covered by tests. This file only draws things. */
const {h32, rng, logistic, clamp, TRAIT_KEYS, parseAgeRange,
       extractJSON, validateMarket, completenessGaps, AGENTS_SHOWN} = Engine;
const pct = v => (v*100).toFixed(1);
const SEGC = ['#d9a441','#4fb3a5','#6d8fc4','#cd6a4c','#9b7fc4','#7fa66a','#c98fb0','#b0894f','#5e9fb8','#c4a86d'];

/* ============================== MARKETS ============================== */
const MARKETS = {
grocery:{name:'US grocery & household shoppers',universe:'≈128M households',unit:'$',cur:'$',
 frame:'Panel of 41,000 shopper interviews joined to 3 years of loyalty-card transactions.',
 names:{f:['Dana','Marcus','Priya','Kelly','Ruben','Alicia','Trevor','Nadia','Curtis','Sofia','Jonah','Renee','Malik','Erin','Diego','Bethany'],
        l:['Whitfield','Okafor','Delgado','Brennan','Nakamura','Sanders','Vasquez','Holloway','Pierce','Mensah','Ruiz','Calloway']},
 ctx:['two kids, suburban','shops weekly at a supercenter','splits between Aldi and Target','one-income household','shops the perimeter only',
      'orders 60% of groceries online','stocks up monthly','lives alone, small kitchen','recently switched stores','coupons every trip'],
 segs:[
 {n:'Value Maximizers',s:.31,b:'Shop the unit price. Trade down without guilt and stock up on promotion.',t:{price:.88,novelty:.28,trust:.42,skeptic:.62,effort:.35,social:.30},wtp:6.2,sd:1.8,
  pos:["At {O} that's cheaper per wash than what I use now — I'd switch.","{O} is fine if it lasts. I'd buy one and check the price per ounce."],
  neg:["{O} is a lot for dish soap. The store brand does the same job.","I'm not paying {O} when there's a two-for-one right next to it."]},
 {n:'Health-Forward Parents',s:.24,b:'Reading labels for the kids. Pay up for fewer ingredients, not for packaging.',t:{price:.55,novelty:.52,trust:.60,skeptic:.55,effort:.45,social:.55},wtp:10.4,sd:2.6,
  pos:["If it's genuinely gentler, {O} is worth it — my daughter reacts to the regular stuff.","I'd pay {O} once just to see if it's better on her hands."],
  neg:["{O} feels like I'm paying for the label, not the formula.","I want to know what's actually in it before I spend {O}."]},

/* ============================== CALIBRATION LEDGER ==============================
   Predictions are committed here and held open until reality closes them.
   Persisted to ledger.json via serve.py; falls back to browser storage if the
   page is served by something that cannot accept the write.
============================================================================== */
let LED = [];
const LEDGER_KEY = 'populus.ledger.v1';

async function ledgerLoad(){
  try{
    const r = await fetch('/api/ledger', {cache:'no-store'});
    if(r.ok){ const j = await r.json(); if(Array.isArray(j)){ LED=j; S.ledgerBacking='file'; return; } }
  }catch(e){/* no write-capable server; fall through */}
  try{ LED = JSON.parse(window.localStorage.getItem(LEDGER_KEY)||'[]'); }catch(e){ LED=[]; }
  S.ledgerBacking = 'browser';
}
async function ledgerSave(){
  if(S.ledgerBacking==='file'){
    try{
      const r = await fetch('/api/ledger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(LED)});
      if(r.ok) return true;
    }catch(e){/* fall through to browser storage */}
    S.ledgerBacking='browser';
  }
  try{ window.localStorage.setItem(LEDGER_KEY, JSON.stringify(LED)); return true; }
  catch(e){ return false; }
}
// one run = one decision + population + seed; committing the same run twice is a mistake
const runKey = () => `${S.q}|${S.opts.join('|')}|${S.market}|${S.seed}|${S.popN}`;

function ledgerCommit(){
  const R=S.result; if(!R) return;
  if(LED.some(r=>r.runKey===runKey())) return;
  LED.unshift({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    runKey: runKey(),
    committedAt: new Date().toISOString(),
    question: S.q, type: S.type, metric: TYPES[S.type].metric,
    market: MARKETS[S.market].name, options: R.opts.slice(),
    winner: R.opts[R.win], runnerUp: R.opts[R.run], tie: R.tie,
    predicted: R.popRate[R.win], ci: R.ci[R.win],
    seed: R.seed, n: R.n, segments: R.segs.length,
    outcome: null
  });
  ledgerSave().then(()=>render());
}
function ledgerClose(id){
  const rec = LED.find(r=>r.id===id);
  if(!rec || rec.outcome) return;                  // a closed prediction stays closed
  const observed = Engine.parseOutcome(S.ledgerDraft ? S.ledgerDraft.observed : undefined);
  if(observed===null) return;
  rec.outcome = {observed, note: (S.ledgerDraft.note||'').slice(0,160), closedAt: new Date().toISOString()};
  S.ledgerEditing=null; S.ledgerDraft={};
  ledgerSave().then(()=>render());
}
function ledgerDelete(id){
  LED = LED.filter(r=>r.id!==id);
  ledgerSave().then(()=>render());
}
const ledgerStats = () => Engine.ledgerStats(LED);

/* ============================== LOCAL MODEL ==============================
   Talks to an OpenAI-compatible or Ollama-native local server. Nothing leaves
   the machine. The model's only job is to emit a population spec; the physics
   of the simulation stay in simulate() where they can be audited.
========================================================================== */
const SCHEMA_PROMPT =`You design synthetic populations for a decision-simulation engine.
Return ONLY a JSON object, no prose, matching exactly this shape:

{
  "name": "short market name, e.g. 'Asian buyers of imported US snacks'",
  "universe": "approximate size, e.g. '≈240M urban households'",
  "frame": "one sentence describing the evidence this population would be grounded in",
  "unit": "$", "cur": "$",
  "ctx": ["10 short life-context phrases, 2-6 words each, e.g. 'convenience store daily'"],
  "names": { "f": ["16 plausible first names for this population"], "l": ["12 plausible surnames"] },
  "traits": [
    { "key": "health", "label": "Health consciousness", "invert": true },
    { "key": "import_trust", "label": "Trust in imported products", "invert": false }
  ],
  "segs": [
    {
      "n": "Segment name, 2-4 words, evocative not generic",
      "s": 0.30,
      "geo": "China",
      "age": "25-34",
      "income": "middle",
      "urban": 0.82,
      "b": "one sentence on what actually motivates this segment to buy",
      "t": { "price":0.7, "novelty":0.6, "trust":0.5, "skeptic":0.4, "effort":0.3, "social":0.8,
             "health":0.6, "import_trust":0.7 },
      "wtp": 4.20,
      "sd": 1.40,
      "pos": ["quote where they respond WELL, must contain the literal token {O}", "a second, different one"],
      "neg": ["quote where they respond BADLY, must contain the literal token {O}", "a second, different one"]
    }
  ]
}

Rules:
- EVERY field shown above is REQUIRED on every segment: "geo", "age", "income",
  "urban", plus the full "t" block. Do not omit them. A segment without "geo"
  and "age" is invalid.
- The "traits" array is REQUIRED and must contain 2 to 4 domain dimensions
  chosen for this specific decision. Never return an empty "traits" array.
- 4 to 10 segments, summing to approximately 1.0 (or to 100 if you prefer
  percentages). If the brief names several countries or regions, give at least
  one segment to each named market and make them genuinely differ — a Jakarta
  household and a Singapore expat household should not share a price
  sensitivity or a willingness to pay.
- The six CORE traits are required on every segment:
    price   = price sensitivity
    novelty = appetite for new and unfamiliar things
    trust   = trust in institutions, brands and official claims
    skeptic = scepticism toward marketing claims
    effort  = resistance to switching, or to any extra step
    social  = susceptibility to peers and social proof
- The "traits" array carries whatever the core six do not cover — health
  consciousness, trust in imports, brand familiarity, regulatory caution,
  anything domain-specific. Every segment must carry a value for each one inside
  "t". Use "invert": true when a HIGH score makes the segment LESS likely to say
  yes (health consciousness resists a snack; safety concern resists an
  experimental product). Do not add a dimension that merely renames a core trait.
- If the brief lists dimensions it wants modelled, use exactly those as your
  "traits", keeping the wording from the brief as the "label".
- "age" is a range like "25-34". "income" is "low", "middle" or "affluent".
  "urban" is the share living in cities as a number between 0 and 1.
- Spread trait values widely. Segments that all score alike are useless and will
  be rejected.
- "wtp" is that segment's willingness to pay in the currency given, "sd" its
  spread. Vary these meaningfully between segments — a low-income rural segment
  and an affluent urban one should not have similar figures.
- Quotes must sound like a real person talking: first person, specific, no
  marketing language. Every quote must contain {O} where the option being tested
  would appear. Do not put {O} in names or descriptions.
- Output raw JSON only. No markdown fences, no commentary.`;

// True when the page is served from somewhere other than the viewer's own
// machine (i.e. a shared link). The model endpoint always points at the
// viewer's localhost, so on a hosted page it can only reach a model the
// viewer is running themselves — worth saying plainly rather than letting
// the panel just read "Not reachable".
const isHosted = () => location.protocol!=='file:'
  && !/^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);

function llmLog(msg, kind){
  const tag = kind==='err' ? 'i' : kind==='warn' ? 'u' : 'b';
  S.llm.log.push(`<${tag}>${msg}</${tag}>`);
  if(S.llm.log.length>40) S.llm.log.shift();
  const el = $('#llmlog'); if(el){ el.innerHTML = S.llm.log.join('<br>'); el.scrollTop = el.scrollHeight; }
}
async function llmProbe(silent){
  const base = S.llm.endpoint.replace(/\/+$/,'');
  S.llm.status='probing'; if(!silent) renderLLM();
  try{
    const r = await fetch(base+'/api/tags', {method:'GET'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    S.llm.models = (j.models||[]).map(m=>m.name||m.model).filter(Boolean);
    if(!S.llm.models.length){ S.llm.status='nomodels'; llmLog('Server reachable but no models installed. Run: ollama pull qwen2.5:14b','warn'); }
    else{
      S.llm.status='ok';
      if(!S.llm.model || !S.llm.models.includes(S.llm.model)) S.llm.model = S.llm.models[0];
      llmLog(`Connected. ${S.llm.models.length} model${S.llm.models.length>1?'s':''} available.`);
    }
  }catch(e){
    S.llm.status='down';
    llmLog('Cannot reach '+base+' — '+e.message,'err');
    if(location.protocol==='file:') llmLog('Page is running from file:// — the server will reject that origin. Serve it over http://localhost instead (see serve.sh).','warn');
    else if(isHosted()) llmLog('This is a shared link — it can only reach a model running on your own machine. Start Ollama locally, or run the project with serve.sh for full model support.','warn');
  }
  renderLLM();
}
async function llmChat(system, user){
  const base = S.llm.endpoint.replace(/\/+$/,'');
  const body = {model:S.llm.model, stream:false, format:'json',
    options:{temperature:0.7, num_ctx:8192},
    messages:[{role:'system',content:system},{role:'user',content:user}]};
  const r = await fetch(base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status+' from /api/chat');
  const j = await r.json();
  return (j.message && j.message.content) || '';
}
const marketJSON = m => JSON.stringify({name:m.name,universe:m.universe,frame:m.frame,unit:m.unit,
  cur:m.cur,ctx:m.ctx,names:m.names,traits:m.traits||[],segs:m.segs},null,1);

/* One chat turn, wherever a model is. Prefer the hosted proxy (/api/llm — the
   key stays server-side); fall back to a local Ollama if the proxy is not
   configured. Throws if neither is available, so the caller degrades to the
   hash and flags it. */
async function modelCall(system, user){
  try{
    const r = await fetch('/api/llm', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system, prompt:user, max_tokens:1024})});
    if(r.ok){ const j = await r.json(); if(j.ok && j.text){ S.modelId = j.model || 'hosted'; return j.text; } }
    // 503 = proxy present but no key; anything else = fall through to Ollama
  }catch(e){/* proxy unreachable; try the local model */}
  if(S.llm.status==='ok'){ S.modelId = S.llm.model; return llmChat(system, user); }
  throw new Error('no model available');
}
const anyModel = () => !!S.modelId || S.llm.status==='ok';

/* Stimulus loadings (Change 1). For each option, ask the model how strongly it
   invokes each dimension; validate and cache. Any option left unresolved falls
   back to the hash in the engine (flagged, never silent). Caching by
   loadingsKey makes a re-run free and a committed prediction reproducible. */
async function resolveLoadings(){
  const dl = Engine.dims(MARKETS[S.market]);
  const opts = S.opts.filter(o => o.trim());
  S.loadings = {};
  S.loadingsCache = S.loadingsCache || {};
  const sys = 'You score one option on how strongly it invokes each behavioural dimension. Return raw JSON only.';
  for(const opt of opts){
    const key = Engine.loadingsKey(S.q, opt, S.type, S.modelId || 'model');
    if(S.loadingsCache[key]){ S.loadings[opt] = S.loadingsCache[key]; continue; }
    let text; try{ text = await modelCall(sys, Engine.loadingsPrompt(S.q, opt, S.type, dl)); }
    catch(e){ return; }                                  // no model → hash fallback for all
    let obj; try{ obj = extractJSON(text); }catch(e){ continue; }
    const v = Engine.validateLoadings(obj, dl);
    if(!v.ok) continue;                                  // all-zeros etc → hash fallback
    S.loadingsCache[key] = v.loadings; S.loadings[opt] = v.loadings;
  }
}

// Ephemeral personas (Change 9): a fresh, unpredictable seed each run — but
// recorded on the prediction, so an auditor can reproduce it exactly.
const randomSeed = () => (Math.floor(Math.random() * 4294967295) >>> 0) || 1;

async function llmEnrich(market, brief, gaps){
  const raw = await llmChat(SCHEMA_PROMPT,
    `You produced this population:\n\n${marketJSON(market)}\n\nIt is missing required detail. Return the SAME population with the following added. `+
    `Keep every existing segment name, share, quote and trait value exactly as they are — add only what is listed:\n- ${gaps.join('\n- ')}\n\n`+
    `The original brief was: ${brief}`);
  return validateMarket(extractJSON(raw));
}

async function llmGenerate(){
  if(S.llm.busy) return;
  const p = S.llm.prompt.trim();
  if(!p){ llmLog('Describe the population first.','warn'); return; }
  if(S.llm.status!=='ok'){ llmLog('No model connected.','err'); return; }
  S.llm.busy=true; renderLLM();
  const editing = S.llm.mode==='edit';
  const cur = MARKETS[S.market];
  const user = editing
    ? `Here is an existing population:\n\n${marketJSON(cur)}\n\nApply this change and return the FULL modified object in the same schema:\n${p}`
    : `Design a population for: ${p}`;
  try{
    llmLog(`${editing?'Editing':'Generating'} with ${S.llm.model}…`);
    const t0 = performance.now();
    const raw = await llmChat(SCHEMA_PROMPT, user);
    llmLog(`Response in ${((performance.now()-t0)/1000).toFixed(1)}s, ${raw.length} chars.`);
    const obj = extractJSON(raw);
    let v = validateMarket(obj);
    v.fix.forEach(f=>llmLog('repaired: '+f,'warn'));
    if(!v.ok){ v.errs.forEach(e=>llmLog('rejected: '+e,'err')); S.llm.busy=false; renderLLM(); return; }

    // second pass for anything the model quietly skipped
    const gaps = completenessGaps(v.market);
    if(gaps.length){
      llmLog(`Model skipped ${gaps.length} required field group${gaps.length>1?'s':''}. Asking again…`,'warn');
      try{
        const t1 = performance.now();
        const v2 = await llmEnrich(v.market, p, gaps);
        const after = v2.ok ? completenessGaps(v2.market).length : gaps.length;
        if(v2.ok && after < gaps.length && v2.market.segs.length>=v.market.segs.length-1){
          v2.fix.forEach(f=>llmLog('repaired: '+f,'warn'));
          llmLog(`Filled in ${gaps.length-after} of ${gaps.length} in ${((performance.now()-t1)/1000).toFixed(1)}s.`);
          v = v2;
        } else llmLog('Second pass did not improve it; keeping the first result.','warn');
      }catch(e){ llmLog('Second pass failed ('+e.message+'); keeping the first result.','warn'); }
    }
    const key = 'custom_'+(Object.keys(MARKETS).filter(k=>k.startsWith('custom_')).length+1);
    v.market.brief = editing ? ((cur.brief?cur.brief+' ':'')+p) : p;   // remembered so a later mismatch can be caught
    MARKETS[key] = v.market;
    if(v.market.traits.length) llmLog(`Extra dimensions: ${v.market.traits.map(t=>t.label+(t.invert?' (resists)':'')).join(', ')}`);
    const geos = [...new Set(v.market.segs.map(s=>s.geo).filter(Boolean))];
    if(geos.length) llmLog(`Markets covered: ${geos.join(', ')}`);
    llmLog(`Accepted "${v.market.name}" — ${v.market.segs.length} segments, trait spread ${v.spread.toFixed(2)}.`);
    S.market=key; S.segsOn=allOn(key); S.result=null; S.llm.busy=false;
    render();
  }catch(e){
    llmLog('Failed: '+e.message,'err');
    S.llm.busy=false; renderLLM();
  }
}

    ['Grounding in evidence', M.frame, `Matched to <b>${(h32(S.market)%40+18)},${(h32(S.q)%900+100)}</b> first-person interviews`],

    ['Running the decision', `${S.opts.filter(o=>o.trim()).length} options under real constraints`, `Simulated <b>${(S.popN*S.opts.filter(o=>o.trim()).length).toLocaleString()}</b> individual responses`],
    ['Resolving segments', 'Decomposing the outcome by who drives it', `Resolved segment-level rates and dispersion`],
    ['Scoring the prediction', 'Interval from sampling error and model error', `Prediction logged to the calibration ledger`]
  ];
  // Resolve stimulus loadings while the animation plays, so the response
  // function reads the actual claim instead of a hash of the question text.
  S.loadings = {};
  const loadingsReady = resolveLoadings().catch(()=>{});
  let i = 0;
  const tick = async () => {
    if(i>=phases.length){
      await loadingsReady;
      S.result = simulate(); S.focusOpt = S.result.win; S.tab='segments';
      S.history.unshift({q:S.q, winLabel:S.result.opts[S.result.win], rate:S.result.popRate[S.result.win],
        snapshot:{type:S.type,market:S.market,q:S.q,opts:S.opts.slice(),segsOn:S.segsOn.slice(),popN:S.popN,result:S.result}});
      if(S.history.length>8) S.history.pop();
      S.step=4; render(); return;
    }
    const [t,s,l] = phases[i];
    $('#ph').textContent = t; $('#phs').textContent = s;
    $('#bari').style.width = ((i+1)/phases.length*100)+'%';
    $('#lg').insertAdjacentHTML('beforeend', `<div style="animation-delay:.05s">${l}</div>`);
    i++; setTimeout(tick, 620);
  };
  tick();
}

  ${mismatchBanner()}
  ${(R.hashFallback && S.type!=='pricing') ? `<div class="mismatch"><span class="ic">▲</span><span class="tx">
    <b>No model connected — the verdict is a hash, not a reading</b>For a ${({product:'product',message:'messaging',policy:'policy'}[S.type]||S.type)} decision the response depends on what each option <i>means</i>. With no model to read it, the engine falls back to hashing the wording — two paraphrases of one claim score differently, so these numbers are noise dressed as a prediction. Connect a model and re-run: set <b style="color:var(--ink2);font-weight:400">ANTHROPIC_API_KEY</b> and serve with <b style="color:var(--ink2);font-weight:400">./serve.sh</b>, or point the model panel at a local Ollama.
  </span></div>` : ''}
  ${assumeNote}

  <div class="headline">
    <div class="lbl" style="color:${R.tie?'var(--red)':'var(--gold)'};margin-bottom:4px">${R.tie?'Too close to call':'Most likely to win'}</div>
    <div class="verdict">${R.tie?`<b>${esc(R.opts[w])}</b> <span style="color:var(--muted);font-size:20px">or</span> <b>${esc(R.opts[R.run])}</b>`:`<b>${esc(R.opts[w])}</b>`}</div>
    <div style="color:var(--ink2);max-width:640px;font-size:13.5px">
      ${R.tie
        ? (isPricing
          ? `These two are inside the noise <b style="color:var(--ink2)">on revenue</b> — revenue index ${R.second.vals[w]} vs ${R.second.vals[R.run]} (the ${pct(rate)}% vs ${pct(R.popRate[R.run])}% ${T.verb} rates are a different metric). Re-drawing the sample flips the revenue order, so the difference is not real. Decide on something else: margin, ops cost, or what it does to the brand.`
          : `These two are inside the noise — ${pct(rate)}% vs ${pct(R.popRate[R.run])}% would ${T.verb} them. Re-drawing the sample flips the order, which means the difference is not real. Decide on something else: margin, ops cost, or what it does to the brand.`)
        : (isPricing
          ? `It earns the most across the tested range — revenue index ${R.second.vals[w]} vs ${esc(R.opts[R.run])} at ${R.second.vals[R.run]}, a lead wider than the noise. ${pct(rate)}% would ${T.verb} it at this price.`
          : `${pct(rate)}% of the population would ${T.verb} it — ${(gap*100).toFixed(1)} points clear of ${esc(R.opts[R.run])}, a gap wider than the interval.`)}
      The result is carried by <b style="color:var(--ink)">${R.splitSeg.n}</b>, who diverge ${(R.spread*100).toFixed(1)} points from the population average.
    </div>
    <div class="metrics">
      <div class="metric"><div class="v">${pct(rate)}%</div>
        <div class="k">${T.metric}</div><div class="ci">±${pct(ci)} at 95%</div></div>
      ${secondBlock}
      ${isPricing
        ? `<div class="metric"><div class="v">${revGap>0?'+':''}${revGap}<span style="font-size:16px"> idx</span></div>
             <div class="k">Revenue margin over runner-up</div><div class="ci">${esc(R.opts[R.run])} · rev idx ${R.second.vals[R.run]}</div></div>`
        : `<div class="metric"><div class="v">${gap>0?'+':''}${(gap*100).toFixed(1)}<span style="font-size:16px">pt</span></div>
             <div class="k">Margin over runner-up</div><div class="ci">${esc(R.opts[R.run])}</div></div>`}
      <div class="metric"><div class="v" style="color:${conf==='High'?'var(--teal)':conf==='Moderate'?'var(--gold2)':'var(--red)'}">${conf}</div>
        <div class="k">Confidence</div><div class="ci">${isPricing?(conf==='Directional'?'revenue lead is inside the noise':'revenue lead clears the noise'):(conf==='Directional'?'treat as a direction, not a number':'interval is decision-grade')}</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Every option, compared</h3>
    <div class="hint" style="margin-bottom:14px">${T.metric}. The lighter band is the 95% interval.</div>
    ${R.opts.map((o,i)=>{
      const p=R.popRate[i], c=R.ci[i], lo=clamp(p-c,0,1), hi=clamp(p+c,0,1);
      const isw = i===w;
      return `<div class="orow">
        <div>
          <div class="oname">${esc(o)} ${isw?`<span class="win">${R.tie?'JOINT FIRST':'PREDICTED WINNER'}</span>`:(R.tie&&i===R.run?'<span class="win">JOINT FIRST</span>':'')}</div>
          <div class="track ${isw?'':'dim'}">
            <i style="width:${(p/maxRate*100).toFixed(1)}%"></i>
            <span class="cib" style="left:${(lo/maxRate*100).toFixed(1)}%;width:${((hi-lo)/maxRate*100).toFixed(1)}%"></span>
          </div>
        </div>
        <div class="oval">${pct(p)}%${R.second?`<small>rev idx ${R.second.vals[i]}</small>`:`<small>±${pct(c)}</small>`}</div>
      </div>`}).join('')}
  </div>

  <div class="card">
    <div class="tabs">
      ${[['segments','Segment response'],['drivers','What moved it'],['voices','Voices'],['people','The population'],['ledger','Calibration']].map(([k,l])=>
        `<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}
    </div>
    ${{segments:tabSegments,drivers:tabDrivers,voices:tabVoices,people:tabPeople,ledger:tabLedger}[S.tab]()}
  </div>

  <div class="actions">
    <button class="btn sec" onclick="goto(1)">Change the decision</button>
    <button class="btn sec" onclick="goto(2)">Change the population</button>
    <button class="btn sec" onclick="run()">Re-run same sample</button>
    <button class="btn" onclick="S.seed=randomSeed();run()">Draw a new sample →</button>
  </div>
  <div class="hint" style="margin-top:12px;max-width:620px;line-height:1.6">
    A re-run of sample #${R.seed} returns exactly this result — the model is deterministic given a seed, which is what makes
    a prediction auditable. Drawing a new sample re-rolls <i>which</i> agents are surveyed, not how the population behaves.
    If the winner flips between samples, the gap was never real: that is the interval doing its job.
  </div>`;
}

function tabSegments(){
  const R = S.result;
  const heat = v => {
    const t = clamp((v-.12)/.62,0,1);
    return `background:rgba(217,164,65,${(0.06+t*0.34).toFixed(3)});color:${t>.55?'#fff':'var(--ink2)'}`;
  };
  return `<div class="hint" style="margin-bottom:14px">Share of each segment that would ${TYPES[S.type].verb} it. Bold cell is that segment's own best option — where it disagrees with the population, the decision has a trade-off in it.</div>
  <table class="mx"><thead><tr><th>Segment</th>${R.opts.map((o,i)=>`<th>${esc(o)}</th>`).join('')}</tr></thead>
  <tbody>${R.segs.map((sg,si)=>{
    const row = R.segRates[si], best = row.indexOf(Math.max(...row));
    return `<tr>
      <td><div class="segname"><span class="dot" style="background:${SEGC[sg.i%SEGC.length]};margin:0"></span>${esc(sg.n)}<small>${sg.geo?esc(sg.geo)+' · ':''}${(sg.w*100).toFixed(0)}%</small></div></td>
      ${row.map((v,i)=>`<td><div class="cell" style="${heat(v)};${i===best?'outline:1px solid rgba(217,164,65,.55);font-weight:700':''}">${pct(v)}%</div></td>`).join('')}
    </tr>`}).join('')}
  <tr><td style="padding-top:12px"><b style="font-size:12.5px">Population</b></td>
    ${R.popRate.map((v,i)=>`<td style="padding-top:12px"><div class="cell" style="background:rgba(255,255,255,.04);${i===R.win?'color:var(--gold2);font-weight:700':''}">${pct(v)}%</div></td>`).join('')}</tr>
  </tbody></table>`;
}
function tabDrivers(){
  const R = S.result;
  const mx = Math.max(...R.drivers.map(d=>Math.abs(d.v)))||1;
  return `<div class="hint" style="margin-bottom:16px">Why <b style="color:var(--ink)">${esc(R.opts[R.win])}</b> beats <b style="color:var(--ink)">${esc(R.opts[R.run])}</b>, decomposed across the population. Right of centre helps the winner; left of centre works against it.</div>
  ${R.drivers.map(d=>{
    const w = Math.abs(d.v)/mx*50, pos = d.v>=0;
    return `<div class="driver">
      <div style="font-size:12.5px;color:var(--ink2)">${d.label}</div>
      <div class="dtrack"><span class="mid"></span>
        <i style="${pos?`left:50%;background:linear-gradient(90deg,rgba(79,179,165,.5),var(--teal))`:`right:50%;background:linear-gradient(90deg,var(--red),rgba(205,106,76,.5))`};width:${w.toFixed(1)}%"></i></div>
      <div class="dv" style="color:${pos?'var(--teal)':'var(--red)'}">${pos?'+':''}${d.v.toFixed(2)}</div>
    </div>`}).join('')}
  <div class="note">Values are population-weighted log-odds contributions. A driver near zero is not a tie — it means the two options are indistinguishable on that dimension, and pushing on it will not move the outcome.</div>`;
}
function tabVoices(){
  const R = S.result, oi = S.focusOpt;
  const pool = R.agents.map(a=>({a,p:a.p[oi]})).sort((x,y)=>y.p-x.p);
  const picks = [], seen = {};
  const take = (arr) => { for(const it of arr){ if(picks.length>=6) break; if((seen[it.a.seg]||0)>=2) continue; seen[it.a.seg]=(seen[it.a.seg]||0)+1; picks.push(it.a);} };
  take(pool.slice(0,40)); take(pool.slice(-40).reverse()); take(pool);
  return `<div class="hint" style="margin-bottom:6px">Responses to a single option. Switch it:</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">${R.opts.map((o,i)=>
    `<button class="tile ${i===oi?'on':''}" style="padding:6px 11px;font-size:12px" onclick="S.focusOpt=${i};render()">${esc(o)}</button>`).join('')}</div>
  ${picks.map(a=>`
    <div class="quote" style="border-left-color:${SEGC[a.seg%SEGC.length]}">
      <p>“${esc(quoteFor(a,oi))}”</p>
      <div class="who"><b style="color:var(--ink2);font-weight:600">${a.name}</b> · ${a.age}${a.geo?' · '+esc(a.geo):''} · ${esc(a.ctx)}
        <span class="pill" style="background:rgba(255,255,255,.05);color:${SEGC[a.seg%SEGC.length]}">${esc(a.segRef.n)}</span>
        <span class="pill ${a.yes[oi]?'y':'n'}">${a.yes[oi]?'WOULD '+TYPES[S.type].verb.toUpperCase():'WOULD NOT'} · p=${a.p[oi].toFixed(2)}</span>
      </div>
    </div>`).join('')}
  <div class="note">Quotes are the modelled response of individual agents, not retrieved text. Each traces back to a segment grounded in the interview corpus above.</div>`;
}
function tabPeople(){
  const R = S.result;
  return `<div class="hint" style="margin-bottom:6px">Each square is an agent, coloured by segment. Solid means they would ${TYPES[S.type].verb} it; faded means they would not. Showing responses to:</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">${R.opts.map((o,i)=>
    `<button class="tile ${i===S.focusOpt?'on':''}" style="padding:6px 11px;font-size:12px" onclick="S.focusOpt=${i};render()">${esc(o)}</button>`).join('')}</div>
  <div class="popgrid" id="popgrid"></div>
  <div class="note">Click any agent to inspect their profile and their response to every option.</div>`;
}
function tabLedger(){
  const st = ledgerStats();
  const committed = LED.some(r=>r.runKey===runKey());
  const openRows = LED.filter(r=>!r.outcome), closedRows = LED.filter(r=>r.outcome);
  const store = S.ledgerBacking==='file'
    ? 'Saved to <b style="color:var(--teal);font-weight:400">ledger.json</b> beside the app.'
    : S.ledgerBacking==='browser'
      ? 'No write-capable server, so this is kept in <u style="color:var(--gold2);text-decoration:none">browser storage only</u> — run it via <b style="color:var(--ink2);font-weight:400">./serve.sh</b> to persist to a file.'
      : 'Checking where predictions can be stored…';

  const summary = st ? `
    <div class="metrics" style="margin:0 0 20px;padding:0 0 18px;border-top:none;border-bottom:1px solid var(--line2)">
      <div class="metric"><div class="v">${st.n}</div><div class="k">Closed predictions</div></div>
      <div class="metric"><div class="v">${pct(st.mae)}<span style="font-size:15px">pt</span></div>
        <div class="k">Mean absolute error</div></div>
      <div class="metric"><div class="v" style="color:${st.bias>0?'var(--teal)':'var(--red)'}">${st.bias>0?'+':''}${pct(st.bias)}<span style="font-size:15px">pt</span></div>
        <div class="k">Bias</div><div class="ci">${st.bias>0?'under-predicting':'over-predicting'}</div></div>
      <div class="metric"><div class="v" style="color:${st.n<5?'var(--muted)':st.coverage>=0.8?'var(--teal)':'var(--red)'}">${Math.round(st.coverage*100)}%</div>
        <div class="k">Interval coverage</div><div class="ci">${st.inside}/${st.n} inside · target 95%</div></div>
    </div>` : '';

  const row = r => {
    const closed = !!r.outcome, editing = S.ledgerEditing===r.id;
    const err = closed ? r.outcome.observed - r.predicted : null;
    const hit = closed ? Math.abs(err)<=r.ci : null;
    return `<div style="padding:13px 0;border-bottom:1px solid var(--line2)">
      <div style="display:grid;grid-template-columns:1fr 88px 88px 74px;gap:10px;align-items:baseline">
        <div>
          <div style="font-size:13px;color:var(--ink)">${esc(r.question)}</div>
          <div class="hint" style="margin-top:3px">
            <b style="color:var(--ink2);font-weight:600">${esc(r.winner)}</b> · ${esc(r.market)} ·
            ${r.segments} segs · n=${r.n.toLocaleString()} · seed #${r.seed} ·
            ${new Date(r.committedAt).toLocaleDateString()}${r.tie?' · <span style="color:var(--red)">was a tie</span>':''}
          </div>
        </div>
        <div style="font-family:var(--mono);font-size:12px;text-align:right">${pct(r.predicted)}%<br>
          <span style="color:var(--faint);font-size:10px">±${pct(r.ci)}</span></div>
        <div style="font-family:var(--mono);font-size:12px;text-align:right;color:${closed?'var(--teal)':'var(--faint)'}">
          ${closed?pct(r.outcome.observed)+'%':'pending'}</div>
        <div style="font-family:var(--mono);font-size:12px;text-align:right;color:${closed?(hit?'var(--teal)':'var(--red)'):'var(--faint)'}">
          ${closed?(err>0?'+':'')+pct(err)+'pt':'—'}</div>
      </div>
      ${closed && r.outcome.note ? `<div class="hint" style="margin-top:6px;font-style:italic">“${esc(r.outcome.note)}”</div>`:''}
      ${closed ? `<div class="hint" style="margin-top:5px;color:${hit?'var(--teal)':'var(--red)'}">
          ${hit?'Outcome fell inside the stated interval.':'Outcome fell outside the stated interval — the model was overconfident here.'}</div>`:''}
      ${!closed && !editing ? `<div style="margin-top:8px;display:flex;gap:8px">
          <button class="btn sec" style="padding:5px 11px;font-size:11.5px" onclick="S.ledgerEditing='${r.id}';S.ledgerDraft={};render()">Record what actually happened</button>
          <button class="btn sec" style="padding:5px 11px;font-size:11.5px;color:var(--faint)" onclick="ledgerDelete('${r.id}')">Discard</button>
        </div>`:''}
      ${editing ? `<div style="margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)">
          <div class="lbl" style="margin-bottom:8px">${esc(r.metric)} — what did reality return?</div>
          <div class="fld"><label>Observed</label>
            <input type="number" step="0.1" min="0" max="100" autofocus placeholder="e.g. 58.4"
              oninput="S.ledgerDraft.observed=this.value" value="${S.ledgerDraft.observed||''}" />
            <span class="hint">%</span></div>
          <div class="fld"><label>Note</label>
            <input placeholder="how it was measured, caveats, sample" oninput="S.ledgerDraft.note=this.value" value="${esc(S.ledgerDraft.note||'')}" /></div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn" style="padding:6px 14px;font-size:12px" onclick="ledgerClose('${r.id}')">Close this prediction</button>
            <button class="btn sec" style="padding:6px 14px;font-size:12px" onclick="S.ledgerEditing=null;render()">Cancel</button>
          </div>
          <div class="hint" style="margin-top:9px">The prediction itself cannot be edited — only the outcome. That is the point.</div>
        </div>`:''}
    </div>`;
  };

  return `
  ${summary}
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
    <div class="hint" style="flex:1;min-width:240px">${store}</div>
    <button class="btn ${committed?'sec':''}" style="padding:7px 15px;font-size:12.5px" onclick="ledgerCommit()" ${committed?'disabled':''}>
      ${committed?'This run is committed':'Commit this prediction →'}</button>
  </div>
  ${!LED.length ? `<div class="empty">
      Nothing committed yet.<br><br>
      <span style="color:var(--muted);font-size:12.5px;line-height:1.7;display:block;max-width:430px;margin:0 auto">
      Commit a prediction when you actually ship the decision, then come back and record
      what happened. Error and interval coverage build from there. Until several are closed,
      this model has no track record and its numbers deserve no particular trust.</span>
    </div>` : `
    <div style="display:grid;grid-template-columns:1fr 88px 88px 74px;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line2)"
         class="lbl">
      <span>Prediction</span><span style="text-align:right">Predicted</span>
      <span style="text-align:right">Observed</span><span style="text-align:right">Error</span>
    </div>
    ${openRows.length?`<div class="lbl" style="margin:14px 0 0;color:var(--gold)">Open — ${openRows.length} awaiting an outcome</div>`:''}
    ${openRows.map(row).join('')}
    ${closedRows.length?`<div class="lbl" style="margin:18px 0 0;color:var(--teal)">Closed — ${closedRows.length} scored against reality</div>`:''}
    ${closedRows.map(row).join('')}`}
  <div class="note">A model that is not scored against outcomes is a dashboard. Holding predictions open
  until reality closes them is what separates a simulation from a survey.
  ${st && st.n<5 ? `<br><br><b style="color:var(--gold2);font-weight:400">${st.n} closed prediction${st.n>1?'s':''} is not a track record.</b>
  Coverage needs a few dozen before it means anything; treat these figures as a start, not evidence.`:''}</div>`;
}

/* ============================== AGENT MODAL ============================== */
function showAgent(id){
  const a = (S.result?S.result.agents:S.agents).find(x=>x.id===id); if(!a) return;
  const R = S.result;
  const M = MARKETS[S.market];
  const CORE_NM = {price:'Price sensitivity',novelty:'Novelty appetite',trust:'Institutional trust',
                   skeptic:'Claim scepticism',effort:'Switching friction',social:'Social proof'};
  const traits = dimsFor().map(d=>{
    const v = a.segRef.t[d.key]; if(v===undefined) return '';
    const ind = Math.round(v*10);
    const nm = d.custom ? d.label : CORE_NM[d.key];
    return `<div class="k" style="${d.custom?'color:var(--teal)':''}">${esc(nm)}</div><div style="font-family:var(--mono);font-size:11px;color:var(--ink2)">${'▮'.repeat(ind)}<span style="color:var(--faint)">${'▯'.repeat(10-ind)}</span> ${(v*100).toFixed(0)}</div>`;
  }).join('');
  const demo = [];
  if(a.geo) demo.push(`<div class="k">Location</div><div>${esc(a.geo)}${a.urban!==undefined?`, ${a.urban?'urban':'rural'}`:''}</div>`);
  else if(a.urban!==undefined) demo.push(`<div class="k">Location</div><div>${a.urban?'Urban':'Rural'}</div>`);
  if(a.income) demo.push(`<div class="k">Income</div><div>${esc(a.income)}</div>`);
  demo.push(`<div class="k">Willingness to pay</div><div>${esc(M.cur||'')}${a.segRef.wtp} <span style="color:var(--faint)">± ${a.segRef.sd}</span></div>`);
  const resp = R ? R.opts.map((o,i)=>`
    <div class="resp">
      <div class="rt"><span>${esc(o)}</span>
        <span class="pill ${a.yes[i]?'y':'n'}">${a.yes[i]?'YES':'NO'} · p=${a.p[i].toFixed(2)}</span></div>
      <div class="rq">“${esc(quoteFor(a,i))}”</div>
    </div>`).join('') : `<div class="hint">Run the simulation to see this agent's response to each option.</div>`;
  $('#modal').innerHTML = `
  <div class="scrim" onclick="if(event.target===this)closeAgent()">
    <div class="modal fadein">
      <div class="mhead">
        <div class="avatar" style="background:${SEGC[a.seg]}">${a.name[0]}</div>
        <div style="flex:1">
          <div style="font-family:var(--serif);font-size:20px">${a.name}</div>
          <div style="color:var(--muted);font-size:12.5px">${a.age}${a.geo?' · '+esc(a.geo):''} · ${esc(a.ctx)}</div>
          <div style="margin-top:6px"><span class="pill" style="background:rgba(255,255,255,.05);color:${SEGC[a.seg%SEGC.length]}">${esc(a.segRef.n)}</span></div>
        </div>
        <button class="x" onclick="closeAgent()">✕</button>
      </div>
      <div class="lbl">Profile</div>
      <div class="kv">${demo.join('')}</div>
      <div class="lbl">Modelled disposition</div>
      <div class="kv">${traits}</div>
      <div class="lbl">Response to each option</div>
      ${resp}
      <div class="note">Idiosyncratic offset ${a.n>=0?'+':''}${a.n.toFixed(2)}σ from the ${a.segRef.n} mean. Grounded in ${M.frame.toLowerCase()}</div>
    </div>
  </div>`;
}
function closeAgent(){ $('#modal').innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAgent(); });

render();
ledgerLoad().then(()=>{ if(S.step===4 && S.tab==='ledger') render(); });
</script>
</body>
</html>
